<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <title>Teste Chunk Upload</title>
</head>
<body>
  <h1>Upload em chunks (5 MB)</h1>

  <input type="file" id="fileInput" />
  <button onclick="upload()">Enviar</button>

  <pre id="log"></pre>

  <script>
    const CHUNK_SIZE = 5 * 1024 * 1024; // 5 MB

    async function upload() {
      const file = document.getElementById('fileInput').files[0];
      if (!file) return;

      const log = document.getElementById('log');
      log.textContent = "A dividir o ficheiro...\n";

      let start = 0;
      let chunkIndex = 0;

      while (start < file.size) {
        const chunk = file.slice(start, start + CHUNK_SIZE);
        const formData = new FormData();

        formData.append("file", chunk, `chunk_${chunkIndex}.mp4`);
        formData.append("email", "mcesarnavarro@gmail.com");
        formData.append("start_time", "0");
        formData.append("duration", "30");

        log.textContent += `A enviar chunk ${chunkIndex}...\n`;

        try {
          const res = await fetch(
            "https://tracking-backend-git-1007213034860.europe-west1.run.app/process?chunk=" + chunkIndex,
            {
              method: "POST",
              body: formData
            }
          );

          const text = await res.text();
          log.textContent += `Chunk ${chunkIndex} enviado: ${text}\n`;
        } catch (err) {
          log.textContent += `Erro no chunk ${chunkIndex}: ${err}\n`;
          return;
        }

        start += CHUNK_SIZE;
        chunkIndex++;
      }

      log.textContent += "\nUpload completo (todos os chunks enviados).";
    }
  </script>
</body>
</html>
